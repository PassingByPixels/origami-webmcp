<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Origami — end card</title>
<style>
/* The house tokens, copied in rather than linked: the reel is recorded from file:// and this
   page must fetch NOTHING. Values are src/app/styles.css :root, inverted onto a dark ground. */
:root {
  --ink: #12110F;
  --ink-deep: #0B0A09;
  --paper: #FAF7F2;
  --paper-soft: #C9C2B5;
  --accent: #7FA877;
  --rule: #2A2823;
  --font-display: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 38%, #1C1A16 0%, var(--ink) 46%, var(--ink-deep) 100%);
  color: var(--paper);
  font-family: var(--font-body);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card { text-align: center; padding: 0 40px; }
.mark { width: 132px; height: 132px; margin: 0 auto 34px; display: block; }
h1 {
  font-family: var(--font-display);
  font-weight: normal;
  font-size: 62px;
  line-height: 1.24;
  letter-spacing: -0.012em;
  margin: 0;
  color: var(--paper);
}
h1 .dim { color: var(--paper-soft); }
.rule {
  width: 132px;
  height: 1px;
  background: var(--rule);
  margin: 40px auto 30px;
  border: 0;
}
.url {
  font-family: var(--font-display);
  font-size: 30px;
  letter-spacing: 0.02em;
  color: var(--accent);
  margin: 0;
}
.sub {
  margin: 18px 0 0;
  font-size: 15px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #6E675C;
}
</style>
</head>
<body>
  <div class="card">
    <!-- CRANE_GROUP, verbatim from src/site/parts.mjs, recoloured for the dark ground -->
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <g fill="#7FA877">
        <polygon points="30,40 47,40 52,11" opacity="0.45"/>
        <polygon points="26,40 48,40 43,7" opacity="0.92"/>
        <polygon points="44,40 62,29 47,48" opacity="0.72"/>
        <polygon points="28,39 48,41 36,55"/>
        <polygon points="21,44 28,39 36,55" opacity="0.7"/>
        <polygon points="9,12 15,13 28,41 22,44" opacity="0.85"/>
        <polygon points="9,12 15,13 14,19 2,17"/>
      </g>
    </svg>
    <h1>One file. Every tool.<br><span class="dim">Either author.</span></h1>
    <hr class="rule">
    <p class="url">origami.gratis</p>
    <p class="sub">Free forever &middot; nothing uploaded</p>
  </div>
</body>
</html>
